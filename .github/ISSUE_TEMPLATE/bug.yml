name: Something isn't working
description: Report a bug in Word Board
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks! Please don't include your child's name, photos, or other personal details: issues are public."
  - type: input
    id: version
    attributes:
      label: App version
      description: Parent settings (hold ⚙ for 2 seconds) → About
      placeholder: "1.5.3"
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: "iPad, Safari, added to Home Screen"
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again (if you know them)
